<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="space" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d1758"/>
      <stop offset="0.45" stop-color="#0b0d2a"/>
      <stop offset="1" stop-color="#03040c"/>
    </radialGradient>
    <radialGradient id="nebA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edff"/>
      <stop offset="1" stop-color="#9aa6d6"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#space)"/>
    <ellipse cx="300" cy="300" rx="420" ry="300" fill="url(#nebA)"/>
    <ellipse cx="780" cy="760" rx="420" ry="300" fill="url(#nebB)"/>
    <g fill="#fff">
      <circle cx="140" cy="180" r="5"/><circle cx="860" cy="140" r="6"/><circle cx="910" cy="420" r="3"/>
      <circle cx="120" cy="620" r="4"/><circle cx="220" cy="880" r="3"/><circle cx="760" cy="900" r="4"/>
      <circle cx="600" cy="110" r="3"/><circle cx="380" cy="140" r="2.5"/><circle cx="930" cy="700" r="3"/>
      <circle cx="80" cy="400" r="2.5"/><circle cx="470" cy="930" r="2.5"/><circle cx="700" cy="230" r="2"/>
    </g>
    <!-- the X: two crossing orbits -->
    <g fill="none" stroke="url(#orbit)" stroke-width="34" stroke-linecap="round" filter="url(#glow)">
      <ellipse cx="512" cy="540" rx="420" ry="118" transform="rotate(38 512 540)"/>
      <ellipse cx="512" cy="540" rx="420" ry="118" transform="rotate(-38 512 540)"/>
    </g>
    <!-- robot head -->
    <g filter="url(#glow)">
      <line x1="512" y1="320" x2="512" y2="380" stroke="#c7d2fe" stroke-width="18" stroke-linecap="round"/>
      <circle cx="512" cy="300" r="28" fill="#67e8f9"/>
    </g>
    <rect x="352" y="372" width="320" height="300" rx="92" fill="url(#hull)"/>
    <rect x="388" y="452" width="248" height="118" rx="59" fill="#070a1f"/>
    <rect x="404" y="468" width="216" height="86" rx="43" fill="url(#visor)" filter="url(#glow)"/>
    <circle cx="468" cy="511" r="20" fill="#f0fdff"/>
    <circle cx="556" cy="511" r="20" fill="#f0fdff"/>
    <!-- orbiting satellites -->
    <circle cx="190" cy="290" r="22" fill="#5eead4" filter="url(#glow)"/>
    <circle cx="842" cy="806" r="22" fill="#a78bfa" filter="url(#glow)"/>
  </g>
</svg>
